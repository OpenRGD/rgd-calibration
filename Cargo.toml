[package]
name = "rgd-calibration"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Hardware-agnostic, non-actuating calibration profiles for OpenRGD"
repository = "https://github.com/OpenRGD/rgd-calibration"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"
thiserror = "2.0"
