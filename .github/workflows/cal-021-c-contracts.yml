name: CAL-021-C Contract conformance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pinned-contract-exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: OpenRGD/openrgd
          ref: afe1a831b950a4e6560f0285a0103fc4eaa343b7
          path: _interop/core
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: OpenRGD/rgd-console
          ref: a0ef857cf425c1bb14ad8f62acec21f8c1324866
          path: _interop/console
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: OpenRGD/rgd-modules
          ref: 0268b3748042d04fd3561553616388368881e04a
          path: _interop/registry
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: OpenRGD/rgd-reality-ingress
          ref: 161318d2897d07d5628ef502cafba1c7c489fff0
          path: _interop/ri
          persist-credentials: false
      # Preserve the reviewed 0.2.0 source/consumer experiment. Never label
      # the future 0.2.1 executable as 0.2.0 in the legacy wrapper.
      - uses: actions/checkout@v4
        with:
          repository: OpenRGD/rgd-calibration
          ref: 646dbc05bcefd15942b25bb55b3c99096f0cccc9
          path: _interop/cal-reviewed
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install local validation dependencies
        run: python -m pip install 'jsonschema[format]==4.23.0' 'typer>=0.9.0' 'rich>=13.0.0'
      - name: Build default CLI and opt-in test fixture
        run: |
          cargo build --locked --manifest-path _interop/cal-reviewed/Cargo.toml --bin rgd-calibration
          cargo build --locked --manifest-path _interop/cal-reviewed/Cargo.toml --features ri-candidate --example contract_exchange
      - name: Validate actual exchanged contracts (offline execution)
        run: |
          python3 _interop/cal-reviewed/scripts/test_contract_exchange.py \
            --core _interop/core --console _interop/console \
            --registry _interop/registry --ri _interop/ri \
            --binary _interop/cal-reviewed/target/debug/rgd-calibration \
            --probe _interop/cal-reviewed/target/debug/examples/contract_exchange
