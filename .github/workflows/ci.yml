name: Foundation CI
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify dependency lockfile
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Compile and test
        run: cargo test --all-targets --locked
      - name: Validate contract and manifest JSON syntax
        run: |
          python3 -m json.tool contracts/calibration-profile.v0.1.schema.json > /dev/null
          python3 -m json.tool contracts/position-observation.v0.1.schema.json > /dev/null
          python3 -m json.tool module.openrgd.json > /dev/null
