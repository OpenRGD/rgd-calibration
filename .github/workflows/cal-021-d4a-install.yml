name: CAL-021-D.4A Parallel install and rollback
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  isolated-registry-install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: OpenRGD/rgd-modules
          ref: 0268b3748042d04fd3561553616388368881e04a
          path: _d4/registry
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: OpenRGD/rgd-calibration
          ref: 292d42aab5e04392b736693233811734bffb603e
          path: _d4/accepted
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"
      - run: python -m pip install 'jsonschema[format]==4.23.0'
      - name: Explicit real install/build of both versions into disposable prefix
        run: |
          python -B scripts/test_d4a_parallel_install.py \
            --registry _d4/registry --accepted _d4/accepted \
            --evidence _d4/evidence/install-review.json
      - name: Retain review evidence only (no binary or descriptor publication)
        uses: actions/upload-artifact@v4
        with:
          name: cal-d4a-install-review
          path: _d4/evidence/install-review.json
          if-no-files-found: error
          retention-days: 30
