name: CAL-021-D.1 Candidate reconciliation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  owner-return-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: OpenRGD/openrgd
          ref: afe1a831b950a4e6560f0285a0103fc4eaa343b7
          path: _d1/core
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: OpenRGD/rgd-console
          ref: 168e99c2ba057ae78bfe4cbde7465c222eaa84de
          path: _d1/console
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: OpenRGD/rgd-modules
          ref: 0268b3748042d04fd3561553616388368881e04a
          path: _d1/registry
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: OpenRGD/rgd-reality-ingress
          ref: 563d923cd65805a2fc40b431635241871720932f
          path: _d1/ri
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: OpenRGD/rgd-calibration
          ref: 81700401e2fa6d370a86b6c1f5a48802bc5f1fc7
          path: _d1/legacy-cal
          persist-credentials: false
      # Preserve the reviewed 0.2.0 source/consumer experiment. Never label
      # the future 0.2.1 executable as 0.2.0 in the legacy wrapper.
      - uses: actions/checkout@v4
        with:
          repository: OpenRGD/rgd-calibration
          ref: f609f827322a3142ba75e8a36a5279bb87fc606e
          path: _d1/cal-reviewed
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install owner test dependencies
        run: python -m pip install 'jsonschema[format]==4.23.0' 'typer>=0.9.0' 'rich>=13.0.0'
      - name: Build the released and candidate passive CLIs and candidate test-only probe
        run: |
          cargo build --locked --manifest-path _d1/legacy-cal/Cargo.toml --bin rgd-calibration
          cargo build --locked --manifest-path _d1/cal-reviewed/Cargo.toml --bin rgd-calibration
          cargo build --locked --manifest-path _d1/cal-reviewed/Cargo.toml --features ri-candidate --example contract_exchange
      - name: Reconcile owner candidates with actual pinned code
        run: |
          python -B _d1/cal-reviewed/scripts/test_d1_reconciliation.py \
            --core _d1/core --console _d1/console --registry _d1/registry \
            --ri _d1/ri --legacy-cal _d1/legacy-cal \
            --legacy-binary _d1/legacy-cal/target/debug/rgd-calibration \
            --binary _d1/cal-reviewed/target/debug/rgd-calibration --probe _d1/cal-reviewed/target/debug/examples/contract_exchange
