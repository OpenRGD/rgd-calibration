name: OCCHI experimental passive CI

on:
  push:
    paths:
      - 'tools/occhi_stereo/**'
      - 'tests/test_occhi_offline.py'
      - '.github/workflows/occhi-experimental-ci.yml'
  pull_request:
    paths:
      - 'tools/occhi_stereo/**'
      - 'tests/test_occhi_offline.py'
      - '.github/workflows/occhi-experimental-ci.yml'

jobs:
  offline-camera-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install passive stereo dependencies
        run: python -m pip install -r tools/occhi_stereo/requirements.txt
      - name: Offline deterministic tests (synthetic only)
        run: python -m unittest discover -s tests -p test_occhi_offline.py -v
